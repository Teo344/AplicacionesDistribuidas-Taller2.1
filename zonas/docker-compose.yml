services:
  postgres:
    image: postgres:16
    container_name: zonas-postgres
    environment:
      POSTGRES_DB: zonas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - zonas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zonas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zonas_postgres_data:
